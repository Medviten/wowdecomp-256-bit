# Forever data for the races retailRaces maps with "race=forever:<id>" (Skyborne 95/96 by default; WOWDECOMP_RETAIL_ASSETS
# builds). Copy to the game folder's Data/Retail/ForeverCasc.ini, or set WOW_FOREVER_CONFIG to its full path.
# Without this file those races keep their DBC model and customization (their modpak's native look).
# The build is pinned: the client's Forever table layouts match wow_classic_beta 1.60.1.70124 (Kalibro's sample config);
# build is its build-config key, cdn the matching CDN-config key.
mode=online
path=Cache/Forever
cache=Cache/ForeverDecoded
product=wow_classic_beta
region=us
build=dd3dfc2881c407299f46c2aaf34c130b
cdn=43061ca8e9f0e2603c8ab50bcae97c2d
version=1.60.1.70124
locale=2
# Files read first, one per FileDataID (ForeverPack/<id>.bin): build with RetailPackBuild --forever Data/Retail/ForeverPack 95 96.
# The CDN above only serves what the pack lacks, and it downloads whole archives while the game waits.
pack=ForeverPack
