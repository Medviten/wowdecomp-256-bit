# Retail data for the retail races (WOWDECOMP_RETAIL_ASSETS builds). Copy to the game folder's
# Data/Retail/RetailCasc.ini, or set WOW_RETAIL_CONFIG to its full path.
# mode=online downloads from the Blizzard CDN into path (relative to this file) and keeps it there.
# The build is pinned: the client's Retail table layouts match 12.1.5.70448 (Kalibro's sample config).
mode=online
path=Cache/Retail
product=wow
region=us
build=88d5e8ef05ec5a8446cdec93d142d7c6
locale=2
# Files read first, one per FileDataID (Pack/<id>.bin): build with RetailPackBuild Data/Retail/Pack <race ...>.
# The CDN above only serves what the pack lacks, and it downloads whole 256 MB archives while the game waits.
pack=Pack

# A local Retail installation instead (no CDN fallback):
# mode=local
# path=C:/Games/World of Warcraft
# product=wow
# locale=2
